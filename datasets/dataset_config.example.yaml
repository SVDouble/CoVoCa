# Usually generated by:
#   uv run --script --python 3.14 datasets/create_loader_config.py --dataset my_dataset
#
# Paths may be absolute or relative to this config file.
schema: covoca.branch1.dataset.v1
name: my_dataset

paths:
  images_dir: ../local/datasets/my_dataset/images
  masks_dir: ../local/datasets/my_dataset/masks
  camera_dir: ../local/datasets/my_dataset/camera

# Loaded masks are binarized with this threshold.
foreground_threshold: 1
