# Usually generated by:
#   uv run --script --python 3.14 datasets/create_loader_config.py --object my_object
#
# Paths may be absolute or relative to this config file.
schema: covoca.branch1.object.v1
name: my_object

paths:
  images_dir: ../local/datasets/my_object/images
  masks_dir: ../local/datasets/my_object/masks
  camera_dir: ../local/datasets/my_object/camera

# Loaded masks are binarized with this threshold.
foreground_threshold: 1
