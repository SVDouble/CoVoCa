schema: covoca.branch1.voxel_carving.v1
name: my_object
output_dir: ../local/results/manual/my_object

voxel_grid:
  # Example object bounds in board coordinates.
  min: [-0.041897, 0.001126, -0.037845]
  max: [0.030897, 0.088227, 0.035495]
  resolution: [100, 100, 100]

# Optional. Remove this section to skip color reconstruction.
color:
  # One method writes to the current directory; multiple methods write one
  # subdirectory per requested color reconstruction method.
  methods: [average, best_view, weighted_average, median]
