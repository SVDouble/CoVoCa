# Paths are resolved relative to this config file.
schema: covoca.branch1.dataset.v1
name: my_dataset

paths:
  images_dir: ../local/datasets/my_dataset/images
  masks_dir: ../local/datasets/my_dataset/masks
  camera_file: ../local/datasets/my_dataset/cameras.txt

# Loaded masks are binarized with this threshold.
foreground_threshold: 1

voxel_grid:
  # Example bounds from the Middlebury dino dataset.
  min: [-0.041897, 0.001126, -0.037845]
  max: [0.030897, 0.088227, 0.035495]
  resolution: [100, 100, 100]

# Optional. Remove this section to skip color reconstruction.
color:
  method: average
